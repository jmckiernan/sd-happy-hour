[build]
  command = "astro build"
  publish = "dist"
  ignore = "exit 0"

# Standalone function (not part of the Astro app) that checks for live
# happy hours and dispatches matching alerts. See
# netlify/functions/dispatch-alerts.mts and README-NOTIFICATIONS-SETUP.md.
[functions]
  directory = "netlify/functions"

[functions."dispatch-alerts"]
  schedule = "*/15 * * * *"

# Tells `netlify dev` how to start the underlying app it wraps (proxying
# in Netlify Blobs, env vars, redirects, etc. on top of plain `astro dev`).
# Using wrapper script to work around Astro 7's daemon mode
[dev]
  command = "./scripts/dev-server.sh"
  targetPort = 4321
  port = 8888

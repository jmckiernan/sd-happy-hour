[build]
  command = "astro build"
  publish = "dist"
  ignore = "exit 0"

[build.environment]
  NODE_VERSION = "22.18.0"

# Standalone function (not part of the Astro app) that checks for live
# happy hours and dispatches matching alerts. See
# netlify/functions/dispatch-alerts.mts and README-NOTIFICATIONS-SETUP.md.
[functions]
  directory = "netlify/functions"

[functions."dispatch-alerts"]
  schedule = "*/15 * * * *"

# Astro's Netlify adapter loads the Netlify Vite plugin during `astro dev`, so
# local Functions, Blobs, redirects, and environment emulation do not need the
# Netlify CLI proxy. `npm run dev:netlify` keeps the familiar port 8888 URL.

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 74">
  <defs>
    <clipPath id="bowl">
      <path d="M10 9h44c-1 20-7 32-22 32S11 29 10 9Z"/>
    </clipPath>
    <linearGradient id="red-wine" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#4a071e"/>
      <stop offset=".55" stop-color="#7f102b"/>
      <stop offset="1" stop-color="#a61b43"/>
    </linearGradient>
  </defs>
  <style>
    .liquid {
      animation: fill 2.1s cubic-bezier(.4, 0, .2, 1) infinite;
      transform-box: fill-box;
      transform-origin: center bottom;
    }
    @keyframes fill {
      0%, 12% { opacity: .72; transform: scaleY(.04); }
      72%, 92% { opacity: 1; transform: scaleY(1); }
      100% { opacity: .72; transform: scaleY(.04); }
    }
    @media (prefers-reduced-motion: reduce) {
      .liquid { animation: none; transform: scaleY(.72); }
    }
  </style>
  <g clip-path="url(#bowl)">
    <rect class="liquid" x="9" y="9" width="46" height="33" fill="url(#red-wine)"/>
  </g>
  <g fill="rgba(255,255,255,.1)" stroke="#0f172a" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5">
    <path d="M10 9h44c-1 20-7 32-22 32S11 29 10 9Z"/>
    <path d="M32 41v22M21 64h22"/>
  </g>
  <path d="M17 14c.5 9 3 15 7 18" fill="none" stroke="#fff" stroke-linecap="round" stroke-width="2" opacity=".55"/>
</svg>

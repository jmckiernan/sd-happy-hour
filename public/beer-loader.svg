<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 74">
  <defs>
    <clipPath id="glass">
      <path d="M11 9h42l-4 55H15Z"/>
    </clipPath>
    <linearGradient id="beer" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#a94f08"/>
      <stop offset=".55" stop-color="#e9950c"/>
      <stop offset="1" stop-color="#f8c84a"/>
    </linearGradient>
  </defs>
  <style>
    .liquid {
      animation: fill 2.1s cubic-bezier(.4, 0, .2, 1) infinite;
      transform-box: fill-box;
      transform-origin: center bottom;
    }
    @keyframes fill {
      0%, 12% { opacity: .72; transform: scaleY(.04); }
      72%, 92% { opacity: 1; transform: scaleY(1); }

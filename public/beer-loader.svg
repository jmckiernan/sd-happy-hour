      <rect x="10" y="13" width="44" height="52" fill="url(#beer)"/>
      <path d="M10 13c4-3 7 2 11 0s7 2 11 0 7 2 11 0 7 2 11 0v7H10Z" fill="#fff2c7" opacity=".9"/>
      <g fill="#fff8e7" opacity=".75">
        <circle cx="23" cy="31" r="1.8"/>
        <circle cx="41" cy="38" r="1.4"/>
        <circle cx="30" cy="49" r="1.2"/>
      </g>
    </g>
  </g>
  <path d="M11 9h42l-4 55H15Z" fill="rgba(255,255,255,.12)" stroke="#0f172a" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"/>
  <path d="M11 9h42" fill="none" stroke="#0f172a" stroke-linecap="round" stroke-width="2.5"/>

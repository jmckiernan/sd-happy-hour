<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 74">
  <defs>
    <clipPath id="bowl">
      <path d="M8 9h48L32 40Z"/>
    </clipPath>
    <linearGradient id="sunset" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset=".55" stop-color="#ff6b35"/>
      <stop offset="1" stop-color="#ffd23f"/>
    </linearGradient>
  </defs>
  <style>
    .liquid {
      animation: fill 2.1s cubic-bezier(.4, 0, .2, 1) infinite;
      transform-box: fill-box;
      transform-origin: center bottom;
    }
    @keyframes fill {
      0%, 12% { opacity: .72; transform: scaleY(.04); }
      72%, 92% { opacity: 1; transform: scaleY(1); }
      100% { opacity: .72; transform: scaleY(.04); }
    }
    @media (prefers-reduced-motion: reduce) {
      .liquid { animation: none; transform: scaleY(.72); }
    }
  </style>
  <g clip-path="url(#bowl)">
    <rect class="liquid" x="7" y="9" width="50" height="32" fill="url(#sunset)"/>
  </g>
  <g fill="rgba(255,255,255,.35)" stroke="#0f172a" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5">
    <path d="M8 9h48L32 40Z"/>
    <path d="M32 40v23M22 64h20"/>
  </g>
  <circle cx="47" cy="15" r="4" fill="#ffd23f" stroke="#0f172a" stroke-width="1.8"/>
</svg>
